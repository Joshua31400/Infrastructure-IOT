services:
  # Ce service represente un capteur de temperature dans la zone IoT
  capteur-t1:
    image: alpine:latest
    container_name: capteur-t1
    hostname: capteur-t1
    # Attribution de la capability NET_ADMIN pour modifier la table de routage
    cap_add:
      - NET_ADMIN
    # Script pour changer la passerelle par defaut (firewall) et garder le container en fonctionnement
    # Il simule aussi des donnees de capteur de temperature et les publie au broker MQTT
    command: |
      sh -c "
      apk add --no-cache mosquitto-clients bash openssl iproute2
      
      ip route del default
      ip route add default via 192.168.10.254
      
      echo 'Capteur T1 demarre'
      
      while true; do
        TEMP=$$((20 + RANDOM % 15))
        TIMESTAMP=$$(date +%s)
      
        mosquitto_pub --cafile /certs/ca.crt --cert /certs/client-capteur.crt --key /certs/client-capteur.key -h 10.0.0.20 -p 8883 -t 'iot/temperature' -m '{\"sensor\":\"T1\",\"value\":'$$TEMP',\"unit\":\"C\",\"timestamp\":'$$TIMESTAMP'}'
      
        echo \"[$$(date)] Temperature envoyee: $$TEMP C\"
        sleep 5
      done
      "
    networks:
      zone-a-iot:
        ipv4_address: 192.168.10.10
    volumes:
      - ../certificates/certs:/certs:ro
    restart: unless-stopped

  # Ce service represente un capteur de consommation electrique dans la zone IoT
  capteur-c1:
    image: alpine:latest
    container_name: capteur-c1
    hostname: capteur-c1
    # Attribution de la capability NET_ADMIN pour modifier la table de routage
    cap_add:
      - NET_ADMIN
    # Script pour changer la passerelle par defaut (firewall) et garder le container en fonctionnement
    # Aussi simule des donnees de capteur de consommation electrique et les publie au broker MQTT
