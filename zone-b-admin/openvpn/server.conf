# Configuration du serveur OpenVPN

port 1194
proto udp
# dev tun est le type d'interface virtuelle utilisee par OpenVPN
dev tun

ca /etc/openvpn/certs/ca.crt
cert /etc/openvpn/certs/vpn-server.crt
key /etc/openvpn/certs/vpn-server.key
dh /etc/openvpn/certs/dh2048.pem

tls-auth /etc/openvpn/certs/ta.key 0

# Utiliser un sous-reseau DIFFERENT pour les clients VPN
# 10.8.0.0/24 est le sous-reseau standard OpenVPN
server 10.8.0.0 255.255.255.0
topology subnet
ifconfig-pool-persist /var/log/openvpn/ipp.txt

# Routes vers les zones internes
push "route 10.0.0.0 255.255.255.0"
push "route 192.168.10.0 255.255.255.0"
push "route 192.168.20.0 255.255.255.0"
push "route 192.168.30.0 255.255.255.0"

# Permettre la communication entre les clients VPN
client-to-client
keepalive 10 120

# Chiffrement et authentification
cipher AES-256-GCM
auth SHA256

# Options de compression
compress lz4-v2
push "compress lz4-v2"

# Limite le nombre maximum de clients connectes
max-clients 3

# Options de persistence
persist-key
persist-tun

# Fichiers de log et de status
status /var/log/openvpn/openvpn-status.log
log-append /var/log/openvpn/openvpn.log
verb 3

# Security settings
tls-version-min 1.2
